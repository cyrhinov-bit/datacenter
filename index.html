  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->

        extend: {

            style: {

              border: '#dbe2ea',

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap');
    
    body {
      background-color: #f0f3f6;
      color: #102a38;
      overflow: hidden;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    /* Style.jpeg Capsule Pill Styling */
    .capsule-pill {
      border-radius: 9999px;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 16px -3px rgba(0, 0, 0, 0.1), 0 3px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .capsule-pill:hover {
      transform: translateY(-2px) scale(1.008);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.18);
    }

    .capsule-vertical {
      border-radius: 28px;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 16px -3px rgba(0, 0, 0, 0.1);
    }
    .capsule-vertical:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.18);
    }

    .photo-card {
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
      transition: all 0.35s ease;
    }
    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px -6px rgba(0, 122, 135, 0.2);
      border-color: #007a87;
    }

    .pill-red { background: linear-gradient(135deg, #e60000 0%, #c40000 100%); }
    .pill-teal { background: linear-gradient(135deg, #008796 0%, #006672 100%); }
    .pill-orange { background: linear-gradient(135deg, #ff570a 0%, #e04400 100%); }
    .pill-green { background: linear-gradient(135deg, #44b33a 0%, #2f8e26 100%); }
    .pill-dark { background: linear-gradient(135deg, #163647 0%, #0c202b 100%); }

    .circle-badge {
      width: 42px;
      height: 42px;
      border-radius: 9999px;
      background-color: #ffffff;
      color: #102a38;
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
      line-height: 1;
    }

    .central-hub {
      background: #ffffff;
      border: 4px solid #007a87;
      box-shadow: 0 15px 35px -5px rgba(0, 122, 135, 0.25), 0 8px 15px -4px rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
    }

    /* Animation Steps */
    .slide-item {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .slide-item.revealed {
      opacity: 1;
      transform: translateY(0);
    }
    .slide-item.from-left { transform: translateX(-35px); }
    .slide-item.from-left.revealed { transform: translateX(0); }
    .slide-item.from-right { transform: translateX(35px); }
    .slide-item.from-right.revealed { transform: translateX(0); }
    .slide-item.zoom-in { transform: scale(0.92); }
    .slide-item.zoom-in.revealed { transform: scale(1); }

    /* Canvas background */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.25;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative overflow-hidden bg-style-bg">

    </div>

      <button id="autoplay-btn" onclick="toggleAutoPlay()" class="px-3.5 py-1.5 rounded-full bg-style-green/10 hover:bg-style-green/20 border border-style-green/30 text-style-green transition flex items-center space-x-1.5 text-xs font-bold shadow-sm" title="Activer / Arrêter la lecture automatique (Touche A)">
        <i id="autoplay-icon" data-lucide="play" class="w-3.5 h-3.5 text-style-green"></i>
        <span id="autoplay-text">Lecture Auto</span>
      </button>

      <select id="speed-select" onchange="changeSpeed(this.value)" class="bg-white text-slate-700 border border-slate-300 text-xs rounded-full px-3 py-1.5 outline-none font-semibold cursor-pointer shadow-sm">
        <option value="1500">Rapide (1.5s)</option>
        <option value="2500" selected>Normal (2.5s)</option>
        <option value="4000">Détaillé (4.0s)</option>

      <span id="slide-indicator" class="px-3.5 py-1 rounded-full text-xs font-mono font-bold bg-style-teal/10 text-style-teal border border-style-teal/30">
        01 / 15
      </span>

      <button onclick="toggleFullscreen()" class="p-2 rounded-full bg-white hover:bg-slate-100 text-slate-600 transition border border-slate-300 shadow-sm" title="Plein écran (Touche F)">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Slide Viewport -->

  <!-- Footer Navigation -->

    <div class="flex items-center space-x-3">
      <button onclick="prevStep()" class="px-4 py-1.5 rounded-full bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 transition flex items-center space-x-1 text-xs font-semibold shadow-sm">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>

      <button onclick="nextStep()" class="px-5 py-1.5 rounded-full bg-style-teal hover:bg-teal-700 text-white font-bold transition flex items-center space-x-1 text-xs shadow-md">
        <span>Suivant</span>

              ✨ La réussite du projet repose sur la contribution et l'engagement de tous les acteurs.
            </div>
          </div>
        `
      }
    ];

    let currentSlideIdx = 0;
    let currentStep = 0;
    let autoPlayInterval = null;
    let autoPlaySpeed = 2500;

    function toggleAutoPlay() {
      const btn = document.getElementById('autoplay-btn');
      const text = document.getElementById('autoplay-text');

      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        text.innerText = "Lecture Auto";
        btn.classList.remove('bg-style-green', 'text-white');
        btn.classList.add('bg-style-green/10', 'text-style-green');
      } else {
        autoPlayInterval = setInterval(() => {
          autoStep();
        }, autoPlaySpeed);
        text.innerText = "Pause";
        btn.classList.remove('bg-style-green/10', 'text-style-green');
        btn.classList.add('bg-style-green', 'text-white');
      }
      lucide.createIcons();
    }

    function changeSpeed(val) {
      autoPlaySpeed = parseInt(val);
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = setInterval(() => {
          autoStep();
        }, autoPlaySpeed);
      }
    }

    function autoStep() {
      const slide = slides[currentSlideIdx];
      if (currentStep < slide.steps) {
        currentStep++;
        revealSteps(currentStep);
      } else {
        if (currentSlideIdx < slides.length - 1) {
          currentSlideIdx++;
          currentStep = 1;
          renderCurrentSlide();
        } else {
          clearInterval(autoPlayInterval);
          autoPlayInterval = null;
          document.getElementById('autoplay-text').innerText = "Rejouer Auto";
          document.getElementById('autoplay-btn').classList.remove('bg-style-green', 'text-white');
          document.getElementById('autoplay-btn').classList.add('bg-style-green/10', 'text-style-green');
        }
      }
    }

    function renderCurrentSlide() {
      const slide = slides[currentSlideIdx];
      const container = document.getElementById('slide-container');
      
      container.innerHTML = slide.render();
      lucide.createIcons();

      document.getElementById('slide-indicator').innerText = `${String(slide.id).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      document.getElementById('slide-topic-name').innerText = `${slide.id}. ${slide.title}`;
      
      const progressPercent = ((currentSlideIdx + 1) / slides.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      revealSteps(currentStep);
    }

    function revealSteps(stepNum) {
      const items = document.querySelectorAll('.slide-item');
      items.forEach(item => {
        let matched = false;
        for (let i = 1; i <= stepNum; i++) {
          if (item.classList.contains(`step-${i}`)) {
            matched = true;
            break;
          }
        }
        if (matched) {
          item.classList.add('revealed');
        } else {
          item.classList.remove('revealed');
        }
      });
    }

    function nextStep() {
      const slide = slides[currentSlideIdx];
      if (currentStep < slide.steps) {
        currentStep++;
        revealSteps(currentStep);
      } else {
        if (currentSlideIdx < slides.length - 1) {
          currentSlideIdx++;
          currentStep = 1;
          renderCurrentSlide();
        }
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        revealSteps(currentStep);
      } else {
        if (currentSlideIdx > 0) {
          currentSlideIdx--;
          currentStep = slides[currentSlideIdx].steps;
          renderCurrentSlide();
        }
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'PageDown') {
        e.preventDefault();
        nextStep();
      } else if (e.code === 'ArrowLeft' || e.code === 'PageUp' || e.code === 'Backspace') {
        e.preventDefault();
        prevStep();
      } else if (e.key === 'a' || e.key === 'A' || e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        toggleAutoPlay();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'Home') {
        e.preventDefault();
        currentSlideIdx = 0;
        currentStep = 1;
        renderCurrentSlide();
      } else if (e.key === 'End') {
        e.preventDefault();
        currentSlideIdx = slides.length - 1;
        currentStep = slides[currentSlideIdx].steps;
        renderCurrentSlide();
      }
    });

    // Background Canvas Particles
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = Math.random() * 1.8 + 0.8;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#007a87';
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(0, 122, 135, ${0.12 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    currentStep = 1;
    renderCurrentSlide();
  </script>
